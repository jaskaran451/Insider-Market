<nav class="navbar">

     <a href="/" class="logo">InsiderAI</a>

    <div class="nav-links">
        <a href="/dashboard" class="nav-item {% if request.path == '/dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/smart-money-trend" class="nav-item  {% if request.path == '/smart-money-trend' %}active{% endif %}">Smart Money</a>
        <a href="/prediction" class="nav-item {% if request.path == '/prediction' %}active{% endif %}">AI Stock Forecast Lab</a>
    </div>

    <div class="nav-auth">
    {% if current_user.is_authenticated %}
        <div class="nav-user-menu">
            <button class="nav-user-trigger" type="button">
                <span>{{ current_user.initials }}</span>
                <i class="fa-solid fa-chevron-down"></i>
            </button>

            <div class="nav-user-dropdown">
                <a href="#" class="dropdown-item disabled">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>

                <a href="{{ url_for('logout') }}" class="dropdown-item logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </div>
    {% else %}
        <a href="{{ url_for('login') }}" class="nav-login-pill">
            <i class="fa-solid fa-user"></i>
            <span>Login</span>
        </a>
    {% endif %}
</div>

</nav>
